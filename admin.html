<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Admin</title>
</head>

<body>

    <h1>Attendance Admin</h1>

    <!-- LOGIN -->
    <div id="loginSection">

        <h2>Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <br><br>

        <button onclick="adminLogin()">
            Login
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- ADMIN AREA -->
    <div id="adminSection" style="display:none;">
<h2>Student Management</h2>

<button onclick="showAddStudent()">
    Add Student
</button>

<div id="studentForm" style="display:none;">

    <h3 id="studentFormTitle">Add Student</h3>

    <input
        type="text"
        id="studentID"
        placeholder="Student ID"
    >

    <br><br>

    <input
        type="text"
        id="studentName"
        placeholder="Student Name"
    >

    <br><br>

    <input
        type="text"
        id="studentCode"
        placeholder="Access Code"
    >

    <br><br>

    <button onclick="saveStudent()">
        Save
    </button>

    <button onclick="cancelStudentForm()">
        Cancel
    </button>

    <p id="studentMessage"></p>

</div>

<div id="studentList"></div>
        <h2>Attendance Records</h2>

        <button onclick="loadAttendance()">
            Load Attendance
        </button>

        <button onclick="logout()">
            Logout
        </button>

        <p id="message"></p>

        <div id="records"></div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://qcmejqlmedjbayrogbrw.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Pjf1WiKUe4f8vGgysvPxfg_uKJHY_8U";


        async function adminLogin() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const loginMessage =
                document.getElementById("loginMessage");

            loginMessage.textContent = "Logging in...";


            const response = await fetch(
                `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                loginMessage.textContent =
                    data.error_description ||
                    "Login failed.";

                return;
            }


            localStorage.setItem(
                "access_token",
                data.access_token
            );


            document.getElementById(
                "loginSection"
            ).style.display = "none";


            document.getElementById(
                "adminSection"
            ).style.display = "block";


            loginMessage.textContent = "";

            loadAttendance();
            loadStudens();
        }


        async function loadAttendance() {

            const token =
                localStorage.getItem("access_token");

            const recordsDiv =
                document.getElementById("records");

            const message =
                document.getElementById("message");


            if (!token) {

                message.textContent =
                    "Please log in first.";

                return;
            }


            message.textContent =
                "Loading...";


            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/attendance_records?select=*&order=student_id.asc`
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


            const records =
                await response.json();


            if (!response.ok) {

                console.error(records);

                message.textContent =
                    "Error loading attendance.";

                return;
            }


            if (records.length === 0) {

                recordsDiv.innerHTML =
                    "No attendance records found.";

                message.textContent = "";

                return;
            }


            let html = `
                <table border="1">

                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
            `;


            records.forEach(record => {

                html += `
                    <tr>
                        <td>${record.student_id}</td>
                        <td>${record.name}</td>
                        <td>${record.date}</td>
                        <td>${record.status}</td>
                    </tr>
                `;

            });


            html += `
                </table>
            `;


            recordsDiv.innerHTML = html;

            message.textContent = "";
        }


        function logout() {

            localStorage.removeItem("access_token");

            document.getElementById(
                "adminSection"
            ).style.display = "none";


            document.getElementById(
                "loginSection"
            ).style.display = "block";
        }
let editingStudentUUID = null;


function showAddStudent() {

    editingStudentUUID = null;

    document.getElementById("studentFormTitle").textContent =
        "Add Student";

    document.getElementById("studentID").value = "";
    document.getElementById("studentName").value = "";
    document.getElementById("studentCode").value = "";

    document.getElementById("studentForm").style.display =
        "block";
}


function cancelStudentForm() {

    editingStudentUUID = null;

    document.getElementById("studentForm").style.display =
        "none";

    document.getElementById("studentMessage").textContent =
        "";
}


async function loadStudents() {

    const token =
        localStorage.getItem("access_token");

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/students?select=id,student_id,name&order=student_id.asc`,
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + token
            }
        }
    );

    const students = await response.json();

    if (!response.ok) {
        console.error(students);
        return;
    }

    let html = `
        <h3>Students</h3>

        <table border="1">

            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
    `;

    students.forEach(student => {

        html += `
            <tr>

                <td>${student.student_id}</td>

                <td>${student.name}</td>

                <td>

                    <button onclick='editStudent(${JSON.stringify(student)})'>
                        Edit
                    </button>

                    <button onclick="deleteStudent('${student.id}')">
                        Delete
                    </button>

                </td>

            </tr>
        `;

    });

    html += `</table>`;

    document.getElementById("studentList").innerHTML =
        html;
}


function editStudent(student) {

    editingStudentUUID = student.id;

    document.getElementById("studentFormTitle").textContent =
        "Edit Student";

    document.getElementById("studentID").value =
        student.student_id;

    document.getElementById("studentName").value =
        student.name;

    document.getElementById("studentCode").value =
        "";

    document.getElementById("studentMessage").textContent =
        "Enter a new access code.";

    document.getElementById("studentForm").style.display =
        "block";
}


async function saveStudent() {

    const token =
        localStorage.getItem("access_token");

    const studentID =
        document.getElementById("studentID").value.trim();

    const name =
        document.getElementById("studentName").value.trim();

    const accessCode =
        document.getElementById("studentCode").value.trim();

    const message =
        document.getElementById("studentMessage");


    if (!studentID || !name || !accessCode) {

        message.textContent =
            "Please fill in all fields.";

        return;
    }


    let url;
    let body;


    if (editingStudentUUID === null) {

        url =
            `${SUPABASE_URL}/rest/v1/rpc/admin_add_student`;

        body = {
            p_student_id: studentID,
            p_name: name,
            p_access_code: accessCode
        };

    } else {

        url =
            `${SUPABASE_URL}/rest/v1/rpc/admin_update_student`;

        body = {
            p_student_uuid: editingStudentUUID,
            p_student_id: studentID,
            p_name: name,
            p_access_code: accessCode
        };
    }


    const response = await fetch(
        url,
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + token
            },

            body: JSON.stringify(body)
        }
    );


    const result =
        await response.json();


    if (!response.ok) {

        console.error(result);

        message.textContent =
            "Could not save student.";

        return;
    }


    message.textContent =
        "Student saved!";

    cancelStudentForm();

    loadStudents();
}


async function deleteStudent(studentUUID) {

    if (!confirm(
        "Are you sure you want to delete this student?"
    )) {
        return;
    }


    const token =
        localStorage.getItem("access_token");


    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/admin_delete_student`,
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + token
            },

            body: JSON.stringify({
                p_student_uuid: studentUUID
            })
        }
    );


    const result =
        await response.json();


    if (!response.ok) {

        console.error(result);

        alert("Could not delete student.");

        return;
    }


    loadStudents();
        }
    </script>

</body>
</html>
