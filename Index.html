<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
</head>

<body>

    <h1>Attendance System</h1>

    <label>Student ID</label><br>
    <input type="text" id="studentID">

    <br><br>

    <label>Access Code</label><br>
    <input type="password" id="accessCode">

    <br><br>

    <button onclick="login()">Login</button>

    <p id="message"></p>

    <script>
        const SUPABASE_URL = "https://qcmejqlmedjbayrogbrw.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_Pjf1WiKUe4f8vGgysvPxfg_uKJHY_8U";

        async function login() {

            const studentID =
                document.getElementById("studentID").value.trim();

            const accessCode =
                document.getElementById("accessCode").value.trim();

            const message =
                document.getElementById("message");

            if (!studentID || !accessCode) {
                message.textContent = "Please enter your ID and code.";
                return;
            }

            message.textContent = "Checking...";

            const response = await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/check_student_login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY
                    },

                    body: JSON.stringify({
                        p_student_id: studentID,
                        p_access_code: accessCode
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                console.error(data);
                message.textContent = "Something went wrong.";
                return;
            }

            if (data.length === 0) {
                message.textContent = "Invalid ID or access code.";
                return;
            }

            const student = data[0];

            message.textContent =
                "Welcome, " + student.name + "!";
        }
    </script>

</body>
</html>
